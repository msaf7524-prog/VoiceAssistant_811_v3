name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libffi-dev \
          libssl-dev \
          ccache \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          autoconf \
          automake \
          libtool \
          libltdl-dev \
          gettext \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          cmake \
          libsqlite3-dev

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-${{ runner.os }}-

    - name: Cache Buildozer local directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-local-${{ runner.os }}-

    - name: Install Build tools & Setup Constraints
      run: |
        python -m pip install --upgrade "pip<24.1" setuptools wheel
        pip install cython buildozer
        echo "pip<24.1" > /tmp/constraints.txt

    - name: Verify project files
      run: |
        echo "Checking extra_manifest.xml..."
        test -f "$GITHUB_WORKSPACE/extra_manifest.xml"
        echo "extra_manifest.xml FOUND"
        echo "Checking buildozer.spec..."
        test -f "$GITHUB_WORKSPACE/buildozer.spec"
        echo "buildozer.spec FOUND"

    - name: Build APK with Buildozer
      env:
        PIP_CONSTRAINT: /tmp/constraints.txt
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceAssistant811-APK
        path: bin/*.apk
