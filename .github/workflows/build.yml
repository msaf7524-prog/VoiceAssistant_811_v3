name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libltdl-dev gettext pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libsqlite3-dev

      - name: Install Updated BuildTools from Source
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython
          pip install --upgrade git+https://github.com/kivy/buildozer.git
          pip install --upgrade git+https://github.com/kivy/python-for-android.git

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAssistant811-APK
          path: bin/*.apk
